services:
  mlflow:
    build:
      context: .
      dockerfile: webservice/Dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow-data
    command:
      - uv
      - run
      - --no-sync
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination
      - /mlflow-data/artifacts
      - --allowed-hosts
      - mlflow:5000,localhost:5000,localhost:5001,127.0.0.1:5001
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - ml-services-monitoring

  model-service:
    build:
      context: .
      dockerfile: webservice/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MONITORING_URL: ${MONITORING_URL:-http://evidently_service:8085/iterate/green_taxi_data}
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - ml-services-monitoring

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command: --web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yaml
    networks:
      - ml-services-monitoring

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ml-services-monitoring

  evidently_service:
    build:
      context: .
      dockerfile: evidently_service/Dockerfile
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8085/', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - ml-services-monitoring

volumes:
  mlflow-data:
  grafana-data:
  prometheus-data:

networks:
  ml-services-monitoring:
    driver: bridge
